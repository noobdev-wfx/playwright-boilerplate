name: Scheduled Coupa Whatfix tests

on:
  schedule:
    # 3rd of every month at 10:00 AM IST (04:30 UTC). GitHub cron is always UTC.
    - cron: "30 4 3 * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COUPA_LOGIN_URL: ${{ secrets.COUPA_LOGIN_URL }}
      COUPA_USERNAME: ${{ secrets.COUPA_USERNAME }}
      COUPA_PASSWORD: ${{ secrets.COUPA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium and system libraries
        run: npx playwright install --with-deps chromium

      - name: Download the Whatfix extension
        run: npm run getExtension

      # The suite loads a Chrome extension, which needs a headed browser,
      # so every browser step runs inside a virtual display.
      - name: Log in to Coupa
        run: xvfb-run --auto-servernum npm run login

      - name: Run all tests
        run: xvfb-run --auto-servernum npm run testAll

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Email the result
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Abhigyan Nath <abhigyan.nath@whatfix.com>
          to: na_sc@whatfix.com
          subject: "Coupa Whatfix tests: ${{ job.status }} (${{ github.run_number }})"
          body: |
            The scheduled Coupa Whatfix test run finished with status: ${{ job.status }}.

            Run details and downloadable reports:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: reports/dashboard.html
          ignore_cert: false
