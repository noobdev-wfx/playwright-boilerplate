name: Scheduled Coupa Whatfix tests

on:
  schedule:
    # Weekdays at 03:30 UTC (09:00 IST). GitHub cron is always UTC.
    - cron: "30 3 * * 1-5"
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BULLHORN_LOGIN_URL: ${{ secrets.BULLHORN_LOGIN_URL }}
      BULLHORN_USERNAME: ${{ secrets.BULLHORN_USERNAME }}
      BULLHORN_PASSWORD: ${{ secrets.BULLHORN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium and system libraries
        run: npx playwright install --with-deps chromium

      - name: Download the Whatfix extension
        run: npm run getExtension

      # The suite loads a Chrome extension, which needs a headed browser,
      # so every browser step runs inside a virtual display.
      - name: Log in to Coupa
        run: xvfb-run --auto-servernum npm run login

      - name: Run all tests
        run: xvfb-run --auto-servernum npm run testAll

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            logs/
          if-no-files-found: warn
          retention-days: 30
